name: PR Gatekeeper Security Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  gatekeeper-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Send PR Diff to Lambda Gatekeeper
        id: gatekeeper
        env:
          # If testing locally, use your ngrok or localtunnel URL pointing to SAM CLI (e.g., http://xxxx.ngrok-free.app/scan)
          # If deployed to AWS, use your live API Gateway endpoint URL
          GATEKEEPER_ENDPOINT: "YOUR_API_GATEWAY_OR_NGROK_URL/scan"
        run: |
          # 1. Capture the exact Git diff between target branch and PR branch
          PR_DIFF=$(git diff origin/${{ github.base_ref }}...HEAD)

          # 2. Package diff and PR metadata into a JSON payload
          PAYLOAD=$(jq -n \
            --arg diff "$PR_DIFF" \
            --arg pr "${{ github.event.pull_request.number }}" \
            '{"raw_diff": $diff, "pull_request": {"number": ($pr | tonumber)}}')

          # 3. POST raw_diff payload to AWS Lambda API endpoint
          RESPONSE=$(curl -s -X POST "$GATEKEEPER_ENDPOINT" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          # 4. Export response for the next step
          echo "result=$RESPONSE" >> $GITHUB_OUTPUT

      - name: Post PR Comment & Enforce Policy
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const rawResponse = process.env.LAMBDA_RESPONSE || '{}';
            let result = {};
            try {
              result = JSON.parse(rawResponse);
            } catch (e) {
              console.log('Error parsing Lambda response:', e);
            }

            const decision = result.decision || 'DENY';
            const hasSecrets = result.has_leaked_secret ? 'TRUE' : 'FALSE';
            const summary = result.summary || 'No AI summary returned.';

            const emoji = decision === 'ALLOW' ? '✅' : '🛑';
            const statusTitle = decision === 'ALLOW' ? 'APPROVED' : 'BLOCKED';

            const commentBody = `
            ## ${emoji} PR Gatekeeper Security Scan: ${statusTitle}

            | Metric | Status |
            | :--- | :--- |
            | **Security Verdict** | \`${decision}\` |
            | **Secrets Detected** | \`${hasSecrets}\` |
            | **Engine** | \`AWS Lambda (Python 3.11)\` |
            | **Audit Persistence** | \`LocalStack S3 Bucket\` |

            ### 📝 AI Code Security Summary
            ${summary}

            ---
            *Evaluated automatically via Cedar Policy Engine, Strands Agents, and AWS Lambda.*
            `;

            // Post structured verdict directly to GitHub PR comments
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });

            // Block merge if policy failed or secrets were detected
            if (decision === 'DENY') {
              core.setFailed('PR Gatekeeper blocked merge due to leaked secrets or security policy violations.');
            }
        env:
          LAMBDA_RESPONSE: ${{ steps.gatekeeper.outputs.result }}